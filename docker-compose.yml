services:
  backend:
    build:
      context: ./backend
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    ports:
      - "51821:51821"       # API (frontend proxies here)
      - "51820:51820/udp"   # WireGuard
    environment:
      - SECRET_KEY=dev-secret-do-not-use-in-prod
      - DB_PATH=/data/wg-admin.db
      - WG_INTERFACE=wg0
      - WG_SUBNET=10.8.0.0/24
      - WG_PORT=51820
      - WG_ENDPOINT=backend
      - WG_DNS=1.1.1.1
      - WG_DRY_RUN=0
    volumes:
      - dhd-data:/data
    networks:
      - dhd
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:51821/api/health"]
      interval: 3s
      retries: 10

  # Lightweight WireGuard client for testing tunnel connectivity.
  # Usage:
  #   1. Create a tunnel in the UI (simple mode → get QR/.conf)
  #   2. docker compose exec client sh
  #   3. Paste the config into /etc/wireguard/wg0.conf
  #   4. wg-quick up wg0
  #   5. ping 10.8.0.1
  client:
    image: alpine:3.21
    command: >-
      sh -c "apk add --no-cache wireguard-tools iptables && sleep infinity"
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dhd

volumes:
  dhd-data:

networks:
  dhd:
